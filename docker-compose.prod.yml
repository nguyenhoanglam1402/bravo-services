version: '3.8'

services:
  db:
    image: postgres:13
    container_name: bravo-postgres
    env_file:
      - .env.prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bravo-database"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: bravo_services
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
